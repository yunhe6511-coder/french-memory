const lessons={"11":{"sections":[{"name":"一　我想起我的家人","lines":["你好，李林！你好吗？","我很好，谢谢。你呢？","很好，谢谢。哦，天气很冷，下雪了。","是啊，因为现在是冬天。","请问，今天是几号？","今天是十三号，十二月十三号。","今天是星期几？","今天是星期五。怎么了？","没什么，只是问问。","你是不是想家了？","是啊，我有点想家。","你家住在哪里？","我家住在河北省。","不远嘛。你过年会回家吧？","不行，我回不去。我们还要考试。","是啊，还有考试……不过还有寒假，对吧？","对，这倒是真的。"],"answers":["","","","","","","","","","","","","","","","",""]},{"name":"二　一张全家福","lines":["凯瑟琳！凯瑟琳！","在！","这是给你的信！","啊，非常感谢……你看，信里有一张照片。哦，是全家福，真是太好了。","这是你家人的照片吗？","是的，小明。你看！","你们家有几口人？","我们家有四口人：爸爸、妈妈、哥哥和我。","这些是你的父母吧？","是的，是爸爸和妈妈。","那位先生和那位女士是谁？","他们是我的祖父母。祖父旁边是我哥哥。祖母旁边的那个是我。","你的祖父母住在你们家吗？","不，不，他们住在别处。不过他们家离我们家不远。","你哥哥多大了？","他现在十五岁，在上高中。","凯瑟琳，你有一个很幸福的家庭。","谢谢你，小明。"],"answers":["","","","","","","","","","","","","","","","","",""]},{"name":"三　索菲的家庭","lines":["这是索菲·里肖。她十九岁，是法国人。她和家人住在巴黎。","他们家有五口人：爸爸、妈妈、姐姐、哥哥和她。","里肖先生是工程师，在法国一家大型石油公司道达尔工作。","里肖夫人是教师，在索邦大学教西班牙语。","她的姐姐和哥哥都是中学生，他们在上中学。"],"answers":["","","","",""]}]},"12":{"sections":[{"name":"一　205号房间","lines":["（小张在二楼遇见一位年轻人。）","对不起，先生，请问205号房间怎么走？","在走廊尽头，左边第二个门。","谢谢您，先生。","不客气。"],"answers":["","","","",""]},{"name":"二　李明的房间","lines":["（小张敲205号房间的门。）","咚……咚……咚……","有人在吗？","有，请进。","你好，朋友。","啊，是你，小张！你好，最近怎么样？","很好，谢谢。你呢？","你看嘛！坐吧！","我猜你不是一个人住吧？","不，我和李一起住，他是我的同学。","这是一间漂亮的房间。","是啊，我觉得很不错。你看，有两张桌子、两张床、两把椅子、两个书架和两个大衣橱。","你们的房间家具很齐全。","是啊，而且我们的房间朝着一座很漂亮的花园，里面有树。","那真不错。","你看，房间离图书馆也很近。","这很方便。你们的房间有多大？","十二平方米，长四米，宽三米。","房间不大。","是的，不过已经够了。","不过……有点麻烦，房间里没有洗脸盆。","走廊尽头有一个大洗脸盆。我们在公共浴室洗澡。"],"answers":["","","","","","","","","","","","","","","","","","","","","",""]},{"name":"三　劳朗丝的来信","lines":["巴黎，12月10日。","亲爱的妈妈：","我来告诉你一个好消息：我在大学城有了一间房。我现在住在德国楼432室，在二楼。","这是一间很漂亮的房间，窗户朝着一座漂亮的花园。当然，房间不太大，长五米、宽三米，对我来说已经足够了。","我的房间家具齐全。除了床，我还有一张书桌、一个书架、两把椅子和一个大衣橱，用来放东西。","床边甚至还有一张小床头柜。","你知道吗，妈妈，对我来说，在大学城找到这间房一点也不容易。我真幸运！","房间里不能做饭，不过一楼有一间配备电炉的厨房。这不太要紧，因为我总是在大学食堂吃饭。","洗澡有点不方便，不过每层楼都有一间公共浴室。我房间里还有一个小洗脸盆，这很方便。","我每天早上七点起床，晚上十一点睡觉。","妈妈，我写得太多了。以后我再跟你讲我在巴黎的生活。回头见。","亲亲你。　劳朗丝"],"answers":["","","","","","","","","","","",""]}]},"13":{"sections":[{"name":"一　今天天气怎么样？","lines":["瞧！今天很冷！","是啊，天空灰蒙蒙的，可能要下雪。","这是正常的。现在是十二月，是冬天。","你那里现在天气怎么样？","我那里现在非常非常冷。经常下雪，到处结冰。而且常常刮风。你知道，那是北方。","我喜欢雪，但讨厌风。","你那里现在天气怎么样？","我们那里的季节变化不太明显。天气不冷也不热，不过最近雨下得很多。你知道，那是南方。","那真是很舒服。"],"answers":["","","","","","","","",""]},{"name":"二　法国的四季","lines":["冬天在3月20日结束，春天在3月21日到来，万物复苏，鲜花盛开。","树木变绿、开花，迎接将在6月22日到来的夏天。","春夏之交，雨水和阳光充足，庄稼和果实生长、成熟。","这两个季节过去后，秋天在9月23日到来，带着黄色的地毯和红色的长袍：草和树叶变红、变黄；庄稼和果实在秋日明媚的阳光下成熟。","最后，树叶落尽，秋天离去，冬天将在12月21日伴着寒风回来。","一年有四季，所有温带地区都是如此。中国和法国也一样，人们总是期待冬天结束、春天归来。"],"answers":["","","","","",""]},{"name":"三　今天是几号？","lines":["今天是星期二，我们要去……","不对！今天不是星期二。","那么，今天是星期几？","今天是星期三！因为今天我们有两节法语课和两节中文课。","等等……两节法语课……两节中文课……是啊，你说得对，今天是星期三。对了，今天是几号？","今天是十号。","现在是几月份？","今天是12月10日，1989年12月10日！","什么？！现在是哪一年？","现在是1989年！……啊，不对！抱歉！现在是1990年！","这才对！谢谢！"],"answers":["","","","","","","","","","",""]}]}};

11:[
["Bonjour, Li Lin. Comment vas-tu?","Je vais bien, merci. Et toi?","Très bien, merci. Oh, il fait très froid. Il neige.","Oui, parce que c'est l'hiver.","S'il te plaît, quelle date sommes-nous aujourd'hui?","Nous sommes le treize, le treize décembre.","Et quel jour sommes-nous aujourd'hui?","Nous sommes vendredi. Qu'est-ce qu'il y a?","Rien, juste pour savoir.","Tu penses à ta famille peut-être?","Oui, je pense un peu à ma famille.","Où habite ta famille?","Elle habite dans la province du Hebei.","Ce n'est pas loin. Tu vas rentrer chez toi le Nouvel An?","Non, je ne peux pas. Nous avons encore des examens.","Oui, il y a encore des examens... Mais il y a encore les vacances d'hiver, n'est-ce pas?","Oui, ça c'est vrai."],
["Catherine! Catherine!","Oui!","Voici une lettre pour toi!","Ah, merci beaucoup. Tiens, il y a une photo dans la lettre. Oh, c'est la photo de famille, c'est très gentil.","C'est une photo des membres de ta famille?","Oui, Xiao Ming. Regarde!","Combien êtes-vous dans votre famille?","Nous sommes quatre dans notre famille: mon père, ma mère, mon frère et moi.","Ce sont tes parents, je pense?","Oui, c'est papa et maman.","Et ce monsieur et cette dame, qui est-ce?","Ce sont mes grands-parents. À côté de mon grand-père, c'est mon frère. Là, près de ma grand-mère, c'est moi.","Où habitent tes grands-parents? Chez vous?","Non, non, ils habitent ailleurs. Mais leur maison n'est pas loin de chez nous.","Quel âge a ton frère?","Il a quinze ans maintenant. Il va au lycée.","Tu as une famille bien heureuse, Catherine.","Merci, Xiao Ming."],
["C'est Sophie Richaud. Elle a dix-neuf ans. Elle est française. Elle habite à Paris avec sa famille.","Ils sont cinq dans leur famille: son père, sa mère, sa sœur, son frère et elle.","Monsieur Richaud est ingénieur. Il travaille chez Total, une grande compagnie pétrolière de France.","Madame Richaud est professeur. Elle enseigne l'espagnol à la Sorbonne.","Sa sœur et son frère sont lycéens. Ils vont au lycée."]],
12:[
["(Xiao Zhang rencontre un jeune homme au premier étage.)","Pardon, Monsieur, la chambre 205, s'il vous plaît?","C'est au fond du couloir, la deuxième porte à gauche.","Merci, Monsieur.","De rien."],
["(Xiao Zhang frappe à la porte de la chambre 205.)","Toc... Toc... Toc...","Il y a quelqu'un?","Oui, entrez, s'il vous plaît.","Bonjour, cher ami.","Ah, c'est toi, Xiao Zhang! Bonjour, comment ça va?","Très bien, merci. Et toi?","Comme tu vois! Assieds-toi!","Tu n'habites pas seul, je pense?","Non, j'habite avec Liu, un camarade de classe.","C'est une belle chambre.","Oui, je la trouve très bien. Tu vois, il y a deux tables, deux lits, deux chaises, deux étagères et deux grands placards.","C'est bien meublé, votre chambre.","Oui. D'ailleurs, notre chambre donne sur un très joli jardin, avec des arbres.","Ça, c'est agréable.","Tu vois, c'est aussi près de la bibliothèque.","C'est pratique. Et quelle surface fait votre chambre?","Douze mètres carrés. Elle mesure quatre mètres sur trois.","Elle n'est pas grande.","C'est vrai. Mais ça suffit déjà.","Mais... c'est ennuyeux, il n'y a pas de lavabo.","Nous avons un grand lavabo au bout du couloir. Et nous prenons la douche dans la salle de bains commune."],
["Paris, le 10 décembre.","Ma chère maman,","Je viens t'annoncer une grande nouvelle: j'ai une chambre dans la Cité universitaire. J'habite maintenant la chambre 432 de la Maison Deutsch. C'est au deuxième étage.","C'est une très belle chambre. Elle donne sur un joli jardin. Bien sûr, elle n'est pas très grande. Elle fait cinq mètres sur trois, cela me suffit largement.","Ma chambre est bien meublée. En plus du lit, j'ai un bureau, une étagère, deux chaises et un grand placard pour mettre mes affaires.","J'ai même une petite table de nuit près du lit.","Tu sais, maman, ce n'est pas facile du tout pour moi de trouver cette chambre dans la cité universitaire. J'ai vraiment de la chance!","On ne peut pas faire la cuisine dans la chambre, mais il y a une cuisine avec des réchauds électriques au premier étage. Ce n'est pas très important, parce que je mange toujours au restaurant universitaire.","C'est un peu ennuyeux pour prendre la douche, mais il y a une salle de bains commune à chaque étage. J'ai encore un petit lavabo dans ma chambre. Ça, c'est pratique.","Tous les jours, je me lève à sept heures du matin et je me couche à onze heures du soir.","Maman, j'écris trop déjà. Je vais te raconter ma vie à Paris plus tard. À bientôt.","Je t'embrasse. Laurence."]],
13:[
["Tiens! Il fait très froid aujourd'hui!","Oui, le ciel est gris. Il va peut-être neiger.","C'est normal. Nous sommes en décembre et c'est l'hiver.","Quel temps fait-il chez toi en ce moment?","Chez moi, maintenant, il fait très très froid. Il neige souvent et il gèle partout. D'ailleurs, il fait souvent du vent. C'est le Nord, tu sais.","J'aime la neige, mais je déteste le vent.","Et quel temps fait-il chez toi en ce moment?","Dans ma région, les saisons ne sont pas très marquées. Il ne fait ni chaud ni froid. Mais il pleut beaucoup en ce moment. Tu sais, c'est le Sud.","C'est vraiment agréable."],
